<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobile Biologist</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#17302b;--mu:#5d7570;--ac:#0f766e;--ac2:#e6f4f1;--bd:#d3e0dc;--dg:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a18;--card:#162623;--tx:#e3efec;--mu:#93aaa5;--ac:#2dd4bf;--ac2:#1b3330;--bd:#2a403c;--dg:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a18;--card:#162623;--tx:#e3efec;--mu:#93aaa5;--ac:#2dd4bf;--ac2:#1b3330;--bd:#2a403c;--dg:#f97066;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav button{white-space:nowrap}
main{padding:0 16px 32px;max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p,nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--dg)}
button.s{padding:3px 9px;font-size:13px}
input,select,textarea{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
label{display:block;font-size:13px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}
th{color:var(--mu);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{min-height:48px;padding:4px;border:1px solid var(--bd);border-radius:8px;font-size:13px}
.cal .h{min-height:0;border:0;color:var(--mu);text-align:center}
.cal .has{background:var(--ac2);cursor:pointer;border-color:var(--ac)}
.cal .sel{outline:2px solid var(--ac)}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
.mu{color:var(--mu)}
.err{color:var(--dg);font-size:13px}
.login{max-width:340px;margin:12vh auto}
.warn{color:var(--dg);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY="mobilebiologist_v1",mem=null;
var s={tab:"sources",user:null,edit:null,editS:null,month:null,day:null,filt:"",rep:{f:"ph",op:">",v:""},err:"",msg:""};
var db;
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function F(id){return document.getElementById(id).value}
function save(){var j=JSON.stringify(db);try{localStorage.setItem(KEY,j)}catch(e){mem=j}}
function load(){var j=null;try{j=localStorage.getItem(KEY)}catch(e){}if(!j)j=mem;try{return j?JSON.parse(j):null}catch(e){return null}}
async function sha(t){
  try{if(window.crypto&&crypto.subtle){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}}catch(e){}
  var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return "f"+(h>>>0).toString(16)
}
async function init(){
  db=load();
  if(!db){
    db={seq:10,users:[{id:1,username:"admin",pass:await sha("admin"),role:"admin"},{id:2,username:"biologo",pass:await sha("biologo"),role:"biologo"}],
    sources:[{id:1,name:"Lago dos Modelos",location:"Parque Central",lat:"-20.4697",lng:"-54.6201"},{id:2,name:"Lagoa das Tartarugas",location:"Reserva Norte",lat:"-20.4412",lng:"-54.5890"},{id:3,name:"Reservatório",location:"Zona Leste",lat:"-20.5102",lng:"-54.5533"}],
    samples:[{id:1,sid:3,date:"2003-06-12",temp:56,ph:5.8,nh3:0.6,no3:70,no2:1.0,notes:"A água parece ruim, provavelmente por causa da chuva longa"},{id:2,sid:2,date:"2003-06-01",temp:76,ph:5.8,nh3:0.2,no3:20,no2:0.4,notes:"Esta água tem cheiro estranho"}]};
    save();
  }
  var d=db.samples.map(function(x){return x.date}).sort().pop();
  s.month=d?new Date(d+"T12:00:00"):new Date();
  s.month.setDate(1);
  render();
}
function srcName(id){var x=db.sources.find(function(a){return a.id==id});return x?x.name:"?"}
function fmtD(d){var p=String(d).split("-");return p.length==3?p[2]+"/"+p[1]+"/"+p[0]:d}
var FL={temp:"Temperatura",ph:"pH",nh3:"Amônia",no3:"Nitrato",no2:"Nitrito"};
function tabs(){
  var t=[["sources","Fontes de água"],["samples","Amostras"],["cal","Calendário"],["rep","Relatórios"],["bk","Backup"]];
  if(s.user.role=="admin")t.splice(4,0,["users","Usuários"]);
  return "<nav>"+t.map(function(x){return '<button class="'+(s.tab==x[0]?"on":"")+'" onclick="A.tab(\''+x[0]+'\')">'+x[1]+"</button>"}).join("")+"</nav>";
}
function vSources(){
  var e=s.edit,f="";
  if(e){f='<div class="card"><h2>'+(e.id?"Editar fonte":"Nova fonte")+'</h2><div class="g"><div><label>Nome</label><input id="f_n" value="'+esc(e.name)+'"></div><div><label>Local</label><input id="f_l" value="'+esc(e.location)+'"></div><div><label>Latitude</label><input id="f_la" value="'+esc(e.lat)+'"></div><div><label>Longitude</label><input id="f_lo" value="'+esc(e.lng)+'"></div></div><div class="row"><button class="p" onclick="A.saveSrc()">Salvar</button><button onclick="A.cancel()">Cancelar</button><span class="err">'+esc(s.err)+"</span></div></div>"}
  var r=db.sources.map(function(x){var n=db.samples.filter(function(a){return a.sid==x.id}).length;return "<tr><td>"+esc(x.name)+"</td><td>"+esc(x.location)+"</td><td>"+esc(x.lat)+", "+esc(x.lng)+'</td><td><span class="badge">'+n+'</span></td><td class="row"><button class="s" onclick="A.newSmp('+x.id+')">+ Amostra</button><button class="s" onclick="A.editSrc('+x.id+')">Editar</button><button class="s d" onclick="A.delSrc('+x.id+')">Excluir</button></td></tr>'}).join("");
  return f+'<div class="card"><div class="row" style="justify-content:space-between"><h2>Fontes de água</h2><button class="p" onclick="A.newSrc()">+ Nova fonte</button></div><div class="sc"><table><tr><th>Nome</th><th>Local</th><th>Coordenadas</th><th>Amostras</th><th></th></tr>'+(r||'<tr><td colspan="5" class="mu">Nenhuma fonte cadastrada.</td></tr>')+"</table></div></div>";
}
function sRow(x){return "<tr><td>"+fmtD(x.date)+"</td><td>"+esc(srcName(x.sid))+"</td><td>"+x.temp+"</td><td>"+x.ph+"</td><td>"+x.nh3+"</td><td>"+x.no3+"</td><td>"+x.no2+"</td><td>"+esc(x.notes)+"</td>"}
function vSamples(){
  var e=s.editS,f="";
  if(e){var o=db.sources.map(function(x){return '<option value="'+x.id+'"'+(x.id==e.sid?" selected":"")+">"+esc(x.name)+"</option>"}).join("");
    f='<div class="card"><h2>'+(e.id?"Editar amostra":"Nova amostra")+'</h2><div class="g"><div><label>Fonte</label><select id="s_s">'+o+'</select></div><div><label>Data</label><input id="s_d" type="date" value="'+esc(e.date)+'"></div><div><label>Temperatura</label><input id="s_t" type="number" step="any" value="'+esc(e.temp)+'"></div><div><label>pH</label><input id="s_p" type="number" step="any" value="'+esc(e.ph)+'"></div><div><label>Amônia</label><input id="s_a" type="number" step="any" value="'+esc(e.nh3)+'"></div><div><label>Nitrato</label><input id="s_n3" type="number" step="any" value="'+esc(e.no3)+'"></div><div><label>Nitrito</label><input id="s_n2" type="number" step="any" value="'+esc(e.no2)+'"></div></div><label>Observações</label><textarea id="s_o" rows="2">'+esc(e.notes)+'</textarea><div class="row" style="margin-top:10px"><button class="p" onclick="A.saveSmp()">Salvar</button><button onclick="A.cancel()">Cancelar</button><span class="err">'+esc(s.err)+"</span></div></div>"}
  var fo='<option value="">Todas as fontes</option>'+db.sources.map(function(x){return '<option value="'+x.id+'"'+(s.filt==x.id?" selected":"")+">"+esc(x.name)+"</option>"}).join("");
  var l=db.samples.filter(function(x){return !s.filt||x.sid==s.filt}).sort(function(a,b){return a.date<b.date?1:-1});
  var r=l.map(function(x){return sRow(x)+'<td class="row"><button class="s" onclick="A.editSmp('+x.id+')">Editar</button><button class="s d" onclick="A.delSmp('+x.id+')">Excluir</button></td></tr>'}).join("");
  return f+'<div class="card"><div class="row" style="justify-content:space-between"><h2>Amostras</h2><div class="row"><select style="width:auto" onchange="A.filt(this.value)">'+fo+'</select><button class="p" onclick="A.newSmp()">+ Nova amostra</button></div></div><div class="sc"><table><tr><th>Data</th><th>Fonte</th><th>Temp.</th><th>pH</th><th>NH₃</th><th>NO₃</th><th>NO₂</th><th>Notas</th><th></th></tr>'+(r||'<tr><td colspan="9" class="mu">Nenhuma amostra.</td></tr>')+"</table></div></div>";
}
function vCal(){
  var m=s.month,y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();
  var nm=m.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  var h=["D","S","T","Q","Q","S","S"].map(function(x){return '<div class="h">'+x+"</div>"}).join("");
  for(var i=0;i<first;i++)h+="<div class='h'></div>";
  for(var d=1;d<=n;d++){var k=y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");var c=db.samples.filter(function(x){return x.date==k}).length;
    h+='<div class="'+(c?"has":"")+(s.day==k?" sel":"")+'"'+(c?' onclick="A.day(\''+k+'\')"':"")+">"+d+(c?' <span class="badge">'+c+"</span>":"")+"</div>"}
  var det="";
  if(s.day){var l=db.samples.filter(function(x){return x.date==s.day});det='<h2 style="margin-top:14px">'+fmtD(s.day)+'</h2><div class="sc"><table><tr><th>Data</th><th>Fonte</th><th>Temp.</th><th>pH</th><th>NH₃</th><th>NO₃</th><th>NO₂</th><th>Notas</th></tr>'+l.map(function(x){return sRow(x)+"</tr>"}).join("")+"</table></div>"}
  return '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><button onclick="A.mon(-1)">←</button><h2 style="margin:0;text-transform:capitalize">'+nm+'</h2><button onclick="A.mon(1)">→</button></div><div class="cal">'+h+"</div>"+det+"</div>";
}
function vRep(){
  var r=s.rep,fo=Object.keys(FL).map(function(k){return '<option value="'+k+'"'+(r.f==k?" selected":"")+">"+FL[k]+"</option>"}).join("");
  var po=[">","<","=",">=","<="].map(function(k){return "<option"+(r.op==k?" selected":"")+">"+esc(k)+"</option>"}).join("");
  var res="";
  if(r.v!==""&&!isNaN(parseFloat(r.v))){var v=parseFloat(r.v);
    var l=db.samples.filter(function(x){var a=parseFloat(x[r.f]);return r.op==">"?a>v:r.op=="<"?a<v:r.op=="="?a==v:r.op==">="?a>=v:a<=v});
    res='<p class="mu">'+l.length+" amostra(s) encontrada(s)</p>"+(l.length?'<div class="sc"><table><tr><th>Data</th><th>Fonte</th><th>Temp.</th><th>pH</th><th>NH₃</th><th>NO₃</th><th>NO₂</th><th>Notas</th></tr>'+l.map(function(x){return sRow(x)+"</tr>"}).join("")+"</table></div>":"")}
  return '<div class="card"><h2>Relatório de amostras</h2><div class="row"><select id="r_f" style="width:auto">'+fo+'</select><select id="r_o" style="width:auto">'+po+'</select><input id="r_v" type="number" step="any" style="width:120px" value="'+esc(r.v)+'"><button class="p" onclick="A.rep()">Gerar</button></div>'+res+"</div>";
}
function vUsers(){
  var r=db.users.map(function(u){return "<tr><td>"+esc(u.username)+"</td><td>"+esc(u.role)+'</td><td><button class="s d" onclick="A.delUser('+u.id+')">Excluir</button></td></tr>'}).join("");
  return '<div class="card"><h2>Novo usuário</h2><div class="g"><div><label>Usuário</label><input id="u_n"></div><div><label>Senha</label><input id="u_p" type="password"></div><div><label>Papel</label><select id="u_r"><option>biologo</option><option>admin</option></select></div></div><div class="row"><button class="p" onclick="A.addUser()">Adicionar</button><span class="err">'+esc(s.err)+'</span></div></div><div class="card"><h2>Usuários</h2><div class="sc"><table><tr><th>Usuário</th><th>Papel</th><th></th></tr>'+r+"</table></div></div>";
}
function vBk(){
  return '<div class="card"><h2>Backup e sincronização manual</h2><p class="mu">Os dados ficam no armazenamento do navegador. Copie o JSON abaixo para guardar um backup, ou cole outro JSON para importar (substitui os dados atuais). Serve também para levar amostras de um aparelho para outro.</p><textarea id="b_t" rows="9" placeholder="JSON">'+esc(JSON.stringify({sources:db.sources,samples:db.samples,seq:db.seq}))+'</textarea><div class="row" style="margin-top:10px"><button class="p" onclick="A.imp()">Importar JSON</button><span class="err">'+esc(s.err)+'</span><span style="color:var(--ac)">'+esc(s.msg)+"</span></div></div>";
}
function render(){
  var a=document.getElementById("app");
  if(!s.user){a.innerHTML='<div class="card login"><h1 style="font-size:20px;margin:0 0 4px">💧 Mobile Biologist</h1><p class="mu" style="margin:0 0 14px">Monitoramento da qualidade da água</p><label>Usuário</label><input id="l_u" autocomplete="username"><label style="margin-top:8px">Senha</label><input id="l_p" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')A.login()"><div class="row" style="margin-top:12px"><button class="p" onclick="A.login()">Entrar</button><span class="err">'+esc(s.err)+'</span></div><p class="mu" style="font-size:13px">Acesso inicial: admin / admin ou biologo / biologo</p></div>';return}
  var v={sources:vSources,samples:vSamples,cal:vCal,rep:vRep,users:vUsers,bk:vBk}[s.tab]();
  a.innerHTML='<header><h1>💧 Mobile Biologist</h1><span class="mu">'+esc(s.user.username)+" ("+esc(s.user.role)+')</span><button onclick="A.out()">Sair</button></header>'+tabs()+"<main>"+v+"</main>";
}
function num(x){return parseFloat(String(x).replace(",","."))}
var A={
  tab:function(t){s.tab=t;s.edit=s.editS=null;s.err=s.msg="";render()},
  cancel:function(){s.edit=s.editS=null;s.err="";render()},
  out:function(){s.user=null;s.err="";render()},
  login:async function(){var u=F("l_u").trim(),h=await sha(F("l_p"));var x=db.users.find(function(a){return a.username==u&&a.pass==h});if(x){s.user=x;s.err="";s.tab="sources"}else s.err="Usuário ou senha inválidos.";render()},
  newSrc:function(){s.edit={name:"",location:"",lat:"",lng:""};s.err="";render()},
  editSrc:function(i){s.edit=Object.assign({},db.sources.find(function(x){return x.id==i}));s.err="";render()},
  saveSrc:function(){var n=F("f_n").trim();if(!n){s.err="Informe o nome.";render();return}var o={name:n,location:F("f_l"),lat:F("f_la"),lng:F("f_lo")};
    if(s.edit.id)Object.assign(db.sources.find(function(x){return x.id==s.edit.id}),o);else{o.id=db.seq++;db.sources.push(o)}save();s.edit=null;s.err="";render()},
  delSrc:function(i){db.sources=db.sources.filter(function(x){return x.id!=i});db.samples=db.samples.filter(function(x){return x.sid!=i});save();render()},
  filt:function(v){s.filt=v;render()},
  newSmp:function(sid){s.tab="samples";s.editS={sid:sid||db.sources[0]&&db.sources[0].id,date:new Date().toISOString().slice(0,10),temp:"",ph:"",nh3:"",no3:"",no2:"",notes:""};s.err="";render()},
  editSmp:function(i){s.editS=Object.assign({},db.samples.find(function(x){return x.id==i}));s.err="";render()},
  saveSmp:function(){var o={sid:+F("s_s"),date:F("s_d"),temp:num(F("s_t")),ph:num(F("s_p")),nh3:num(F("s_a")),no3:num(F("s_n3")),no2:num(F("s_n2")),notes:F("s_o")};
    if(!o.sid||!o.date||[o.temp,o.ph,o.nh3,o.no3,o.no2].some(isNaN)){s.err="Preencha fonte, data e todos os valores numéricos.";render();return}
    if(o.ph<0||o.ph>14){s.err="O pH deve estar entre 0 e 14.";render();return}
    if(s.editS.id)Object.assign(db.samples.find(function(x){return x.id==s.editS.id}),o);else{o.id=db.seq++;db.samples.push(o)}save();s.editS=null;s.err="";render()},
  delSmp:function(i){db.samples=db.samples.filter(function(x){return x.id!=i});save();render()},
  mon:function(d){s.month=new Date(s.month.getFullYear(),s.month.getMonth()+d,1);s.day=null;render()},
  day:function(k){s.day=k;render()},
  rep:function(){s.rep={f:F("r_f"),op:F("r_o"),v:F("r_v")};render()},
  addUser:async function(){var n=F("u_n").trim(),p=F("u_p");if(!n||!p){s.err="Informe usuário e senha.";render();return}
    if(db.users.some(function(u){return u.username==n})){s.err="Esse usuário já existe.";render();return}
    db.users.push({id:db.seq++,username:n,pass:await sha(p),role:F("u_r")});save();s.err="";render()},
  delUser:function(i){if(i==s.user.id){s.err="Você não pode excluir o próprio usuário.";render();return}db.users=db.users.filter(function(u){return u.id!=i});save();s.err="";render()},
  imp:function(){try{var o=JSON.parse(F("b_t"));if(!Array.isArray(o.sources)||!Array.isArray(o.samples))throw 0;db.sources=o.sources;db.samples=o.samples;db.seq=o.seq||db.seq+100;save();s.err="";s.msg="Importado com sucesso.";}catch(e){s.err="JSON inválido.";s.msg=""}render()}
};
init().catch(function(e){document.getElementById("app").innerHTML='<div class="card"><p class="warn">Erro ao iniciar: '+esc(e&&e.message||e)+"</p></div>"});
</script>
</body>
</html>
