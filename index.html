<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Mobile Biologist</title>
<link rel="stylesheet" href="style.css"> 
</head>
<body>
<div id="app">
  <section id="login-screen" class="card login" hidden>
    <div class="login-hero">💧</div>
    <h1 class="login-title">Mobile Biologist</h1>
    <p class="mu login-sub">Uma versão em web do sistema MobileBiologist, uma demonstração de como a aplicação de 2003 funcionaria na prática atual.</p>

    <label for="l_u">Usuário</label>
    <input id="l_u" autocomplete="username" placeholder="admin">

    <label for="l_p" class="mt-8">Senha</label>
    <input id="l_p" type="password" autocomplete="current-password" placeholder="••••••">

    <div class="row mt-12">
      <button class="p full" id="btn-login">Entrar</button>
    </div>
    <p class="err center" id="login-err"></p>

    <p class="mu hint center">admin / admin · biologo / biologo</p>
  </section>

  <section id="app-screen" hidden>
    <div id="sidebar-overlay" hidden></div>

    <header>
      <button id="btn-menu" class="icon-btn menu-btn" title="Menu">☰</button>
      <h1>💧 Mobile Biologist</h1>
      <span class="mu" id="user-info"></span>
      <button id="btn-logout" class="icon-btn" title="Sair">⏻</button>
    </header>
    <nav id="nav-tabs"></nav>
    <main id="view"></main>
  </section>

</div>
<script src="javascript/utils.js"></script>
<script src="javascript/state.js"></script>
<script src="javascript/views.js"></script>
<script src="javascript/actions.js"></script>
<script src="javascript/app.js"></script>
</body>
</html>
